<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0%;
        padding: 0%;
        background-color: skyblue;
    }
    .img{
        display: flex;
        background-color: skyblue;
       
    }
    .h1{
        padding: 250px;
    }
    .form{
       
        height: 350px;
        width: 400px;
        margin-right: 50px;
        padding: 50px;
        
        margin-top: 100px;
        background-color: white;
        border-radius: 5px;
        

    }
    .phone{
        padding: 10px;
        
        font-size: 20px;
        margin-bottom: 20px;
        border-radius: 3px;
        background-color: white;

    }
    .password{
        padding: 10px;
        font-size: 20px;
        margin-bottom: 20px;
        align-items: center;
        border-radius: 3px;
        background-color: white;
    }
    .btn{
        padding: 10px;
        font-size: 20px;
        margin-bottom: 20px;
        width: 280px;
        border-radius: 3px;
    }
    .create{
        padding: 10px;
        font-size: 15px;
        margin-bottom: 20px;
        width: 200px;
        margin-left:25px;
        border-radius: 3px;
        
    }
    .for{
        padding: 10px;
        font-size: 35px;
        margin-bottom: 20px;
        background-color: white;

    }
    
       
    .pa{
        margin-left: 1100px;
        background-color: skyblue;
        font-size: 20px;
       
    }

</style>
<body>
    <!--BOX MODEL-->
    <div class="img">
        <!--main div-->
        <div class="h1">
           <h1 style="color:blue;font-size:80px;">facebook</h1>
            <h2>Facebook helps you connect and share with the people in your life</h2>
           
        </div>
        <div class="form">
            
                <input type="text"class="phone"placeholder="Enter address or Phone Number"style="background-color">
                <input type="text"class="password"placeholder="Password">
                <button style="background-color:blue;color:white;"class="btn">Log in</button>
                <p class="for">Forgotten password</p>
                <button style="background-color:green;color:white;"class="create">Create new account</button>
            
            
        </div>
        
       
    </div>
    <div class="bottom"><p class="pa">Create a Page for a celebrity,brand or business</p></div>
   
    
</body>
</html>
